<style>
:root{--bg:#0D1117;--bg-card:#161B22;--bg-lane:#0D1117;--bg-lh:#161B22;--bg-detail:#161B22;--text:#E6EDF3;--text-dim:#8B949E;--text-muted:#484F58;--border:#21262D;--accent:#58A6FF;--green:#3FB950;--yellow:#D29922;--orange:#DB6D28;--red:#F85149;--purple:#BC8CFF;--rose:#B76E79;--drag-over:rgba(88,166,255,.12);--r:10px;--rs:6px;--shadow:0 2px 8px rgba(0,0,0,.3)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F6F8FA;--bg-card:#FFF;--bg-lane:#F0F2F5;--bg-lh:#FFF;--bg-detail:#FFF;--text:#1F2328;--text-dim:#656D76;--text-muted:#B0B8C1;--border:#D1D9E0;--shadow:0 2px 8px rgba(0,0,0,.08);--drag-over:rgba(88,166,255,.08)}}
:root[data-theme="dark"]{--bg:#0D1117;--bg-card:#161B22;--bg-lane:#0D1117;--bg-lh:#161B22;--bg-detail:#161B22;--text:#E6EDF3;--text-dim:#8B949E;--text-muted:#484F58;--border:#21262D;--shadow:0 2px 8px rgba(0,0,0,.3);--drag-over:rgba(88,166,255,.12)}
:root[data-theme="light"]{--bg:#F6F8FA;--bg-card:#FFF;--bg-lane:#F0F2F5;--bg-lh:#FFF;--bg-detail:#FFF;--text:#1F2328;--text-dim:#656D76;--text-muted:#B0B8C1;--border:#D1D9E0;--shadow:0 2px 8px rgba(0,0,0,.08);--drag-over:rgba(88,166,255,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Space Grotesk',sans-serif}
.mono{font-family:'JetBrains Mono',monospace;font-size:.85em}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;background:var(--bg)}
.hdr h1{font-size:1.2rem;font-weight:700}
.hdr-r{display:flex;gap:10px;align-items:center}
.tbtn{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:var(--rs);padding:5px 9px;cursor:pointer;font-size:.82rem}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}

/* BOARD */
.board{display:flex;gap:0;padding:16px 16px;overflow-x:auto;scroll-snap-type:x mandatory;min-height:calc(100vh - 52px);align-items:flex-start}
.board.grid-layout{display:grid;grid-template-columns:1fr 1fr;gap:12px;overflow-x:visible;scroll-snap-type:none}
.board.grid-layout .lane-gap{display:none}
.board.grid-layout .lane{flex:none!important;width:100%!important;max-height:none}
.board.grid-layout .lane-resize{display:none}
.lane{flex:0 0 320px;scroll-snap-align:start;background:var(--bg-lane);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 80px);position:relative;transition:border-color .15s;min-width:200px}
.lane.drag-over-lane{border-color:var(--accent);box-shadow:0 0 0 2px rgba(88,166,255,.25)}
.lane.drag-over{background:var(--drag-over);border-color:var(--accent)}
.lane-hdr{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg-lh);border-radius:var(--r) var(--r) 0 0;display:flex;align-items:center;gap:8px;cursor:grab;user-select:none}
.lane-hdr:active{cursor:grabbing}
.lane-ico{font-size:1.1rem}
.lane-ttl{font-size:.95rem;font-weight:600;flex:1}
.lane-cnt{font-size:.7rem;color:var(--text-muted);background:var(--bg);padding:2px 7px;border-radius:10px}
.lane-body{padding:6px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:6px;min-height:50px}

/* LANE RESIZE HANDLE */
.lane-resize{position:absolute;top:0;right:-6px;width:12px;height:100%;cursor:col-resize;z-index:10}
.lane-resize::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:28px;background:var(--border);border-radius:2px;opacity:0;transition:opacity .15s}
.lane-resize:hover::after,.lane-resize.active::after{opacity:1;background:var(--accent)}
/* GAP between lanes */
.lane-gap{flex:0 0 12px;min-width:12px}

/* CARDS */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;overflow:hidden;min-height:40px}
.card:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.card.dragging{opacity:.35;transform:scale(.95)}
.card[draggable]{cursor:grab}
.card[draggable]:active{cursor:grabbing}
.card-t{font-size:.85rem;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.card-d{font-size:.75rem;color:var(--text-dim);line-height:1.4}
.card-m{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.card-expand{max-height:none!important}

/* CARD RESIZE HANDLE */
.card-rz{height:8px;cursor:ns-resize;display:flex;justify-content:center;align-items:center;margin-top:4px}
.card-rz::after{content:'';width:24px;height:3px;background:var(--border);border-radius:2px;opacity:0;transition:opacity .15s}
.card:hover .card-rz::after{opacity:1}

/* BADGES */
.b{font-size:.68rem;padding:2px 6px;border-radius:3px;font-weight:500;white-space:nowrap}
.bg{background:rgba(63,185,80,.15);color:var(--green)}
.bb{background:rgba(88,166,255,.15);color:var(--accent)}
.by{background:rgba(210,153,34,.15);color:var(--yellow)}
.bo{background:rgba(219,109,40,.15);color:var(--orange)}
.br{background:rgba(248,81,73,.15);color:var(--red)}
.bp{background:rgba(188,140,255,.15);color:var(--purple)}
.bd{background:rgba(139,148,158,.1);color:var(--text-muted)}

/* PROGRESS */
.pw{width:100%;height:4px;background:var(--border);border-radius:2px;margin-top:5px}
.pb{height:100%;border-radius:2px;transition:width .3s}

/* SECTION CARDS */
.sc{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--rs);padding:10px 12px;min-height:40px;position:relative}
.sc h4{font-size:.8rem;font-weight:600;margin-bottom:5px}
.sc ul{list-style:none;padding:0}
.sc li{font-size:.75rem;color:var(--text-dim);padding:2px 0;border-bottom:1px solid var(--border)}
.sc li:last-child{border:none}
.sc .v{color:var(--text);font-weight:500}
.sc a{color:var(--accent);text-decoration:none}
.sc a:hover{text-decoration:underline}

/* ═══ DETAIL PAGE ═══ */
.page-detail{display:none;padding:20px;max-width:800px;margin:0 auto}
.page-detail.active{display:block}
.board.hidden{display:none}
.back-link{color:var(--accent);text-decoration:none;font-size:.85rem;display:inline-flex;align-items:center;gap:4px;margin-bottom:16px}
.back-link:hover{text-decoration:underline}
.detail-head{margin-bottom:20px}
.detail-head h2{font-size:1.4rem;margin-bottom:6px}
.detail-head .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.detail-sec{margin-top:24px}
.detail-sec h3{font-size:1rem;color:var(--accent);margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:5px}
.detail-sec p{font-size:.85rem;color:var(--text-dim);line-height:1.6}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.82rem}
.kv dt{color:var(--text-dim)}.kv dd{color:var(--text)}
.detail-sec table{width:100%;border-collapse:collapse;font-size:.82rem}
.detail-sec td,.detail-sec th{padding:7px 10px;border-bottom:1px solid var(--border);text-align:left}
.detail-sec th{color:var(--text-dim);font-weight:500}
.cklist{list-style:none;padding:0}
.cklist li{font-size:.82rem;padding:5px 0;color:var(--text-dim);border-bottom:1px solid var(--border)}
.cklist li:last-child{border:none}
.cklist li::before{content:'☐ ';color:var(--text-muted)}
.cklist li.done{color:var(--text-muted);text-decoration:line-through}
.cklist li.done::before{content:'☑ ';color:var(--green)}
.sub-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:.85rem;cursor:pointer}
.sub-item:hover{color:var(--accent)}
.sub-item:last-child{border:none}
.sub-prog{display:flex;align-items:center;gap:8px;flex:1}
.sub-prog .pw{flex:1;height:6px}

/* MOBILE */
@media(max-width:768px){
  .board{flex-direction:column;scroll-snap-type:none;gap:12px}
  .lane{flex:none!important;width:100%!important;max-height:none;min-width:0}
  .lane-resize{display:none}
  .lane-gap{display:none}
}
</style>
</head>

function renderBoard(){
  const board=document.getElementById('board');
  board.classList.remove('hidden');
  document.getElementById('page-detail').classList.remove('active');

  const order=loadLaneOrder();
  const lanes=order?order.map(id=>LANES.find(l=>l.id===id)).filter(Boolean):LANES;

  let html='';
  lanes.forEach((lane,i)=>{
    if(i>0) html+='<div class="lane-gap"></div>';
    const cards=lane.id==='projetos'?P.filter(p=>!p.parent).map(cardHTML).join(''):
      lane.id==='saude'?SAUDE.map(sectionHTML).join(''):
      lane.id==='espiritual'?ESPIR.map(sectionHTML).join(''):
      FIN.map(sectionHTML).join('');
    const cnt=lane.id==='projetos'?P.filter(p=>!p.parent).length:
      lane.id==='saude'?SAUDE.length:lane.id==='espiritual'?ESPIR.length:FIN.length;
    const w=loadLaneWidth(lane.id);
    html+=`<div class="lane" data-lane="${lane.id}" style="border-top:3px solid ${lane.color};${w?'flex-basis:'+w+'px':''}">
      <div class="lane-hdr" draggable="true" data-lane-drag="${lane.id}">
        <span class="lane-ico">${lane.icon}</span>
        <span class="lane-ttl">${lane.title}</span>
        <span class="lane-cnt">${cnt}</span>
      </div>
      <div class="lane-body" data-lane="${lane.id}">${cards}</div>
      <div class="lane-resize" data-resize-lane="${lane.id}"></div>
    </div>`;
  });
  board.innerHTML=html;
  initCardDrag();
  initLaneDrag();
  initLaneResize();
}

function openDetail(id){

  const d=p.detail||{};

  pg.classList.add('active');

  let h=`<a href="#" class="back-link" onclick="event.preventDefault();renderBoard()">← Voltar ao dashboard</a>`;
  h+=`<div class="detail-head"><h2>${p.title}</h2><div class="meta">`;
  if(p.status)h+=`<span class="b ${sb(p.status)}">${p.status}</span>`;
  if(p.progress!==undefined)h+=`<span class="b bd">${p.progress}%</span>`;
  if(p.pilar)h+=`<span class="b bd">${p.pilar}</span>`;
  if(p.priority)h+=`<span class="b bp">${p.priority}</span>`;

  h+=`</div>`;

  if(d.resumo)h+=`<div class="detail-sec"><h3>Resumo</h3><p>${d.resumo}</p></div>`;
  if(d.stack)h+=`<div class="detail-sec"><h3>Stack</h3><p class="mono">${d.stack}</p></div>`;
  if(d.kv){h+=`<div class="detail-sec"><h3>Detalhes</h3><dl class="kv">`;for(const[k,v] of Object.entries(d.kv))h+=`<dt>${k}</dt><dd>${v}</dd>`;h+=`</dl></div>`;}

  // Children (subprojects)
  if(p.children&&p.children.length){
    h+=`<div class="detail-sec"><h3>Subprojetos</h3>`;
    p.children.forEach(cid=>{
      const child=P.find(x=>x.id===cid);

      const total=child.detail?.subtasks?child.detail.subtasks.length:0;
      h+=`<div class="sub-item" onclick="openDetail('${child.id}')">
        <span class="b ${sb(child.status)}" style="min-width:50px;text-align:center">${child.progress}%</span>
        <div class="sub-prog">
          <span style="font-weight:500;min-width:120px">${child.title}</span>
          <div class="pw" style="height:6px"><div class="pb" style="width:${child.progress}%;background:${pc(child.progress)}"></div></div>
        </div>
        <span class="b ${sb(child.status)}">${child.status}</span>
        ${total?`<span style="font-size:.72rem;color:var(--text-muted)">${done}/${total}</span>`:''}
      </div>`;
    });
    h+=`</div>`;
  }

  // Subtasks
  if(d.subtasks&&d.subtasks.length){
    const done=d.subtasks.filter(s=>s.done).length;
    h+=`<div class="detail-sec"><h3>Progresso das Tarefas <span style="font-size:.8rem;color:var(--text-muted)">(${done}/${d.subtasks.length})</span></h3>`;
    h+=`<div class="pw" style="height:8px;margin-bottom:12px"><div class="pb" style="width:${(done/d.subtasks.length*100)}%;background:${pc(done/d.subtasks.length*100)}"></div></div>`;
    h+=`<ul class="cklist">`;
    d.subtasks.forEach(s=>h+=`<li class="${s.done?'done':''}">${s.t}</li>`);
    h+=`</ul></div>`;
  }

  if(d.server)h+=`<div style="margin-top:16px;font-size:.75rem;color:var(--text-muted)">Server: ${d.server}</div>`;

  pg.innerHTML=h;
}

// ═══════════════════ CARD DRAG & DROP ═══════════════════

function initCardDrag(){
  document.querySelectorAll('.card[draggable]').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      if(e.target.closest('.lane-hdr'))return;
      card.classList.add('dragging');
      e.dataTransfer.setData('text/plain','card:'+card.dataset.id);
      e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
  });

  document.querySelectorAll('.lane-body').forEach(body=>{
    body.addEventListener('dragover',e=>{
      const dt=e.dataTransfer.types;
      if(!dt.includes('text/plain'))return;
      e.preventDefault();
      e.dataTransfer.dropEffect='move';
      body.closest('.lane').classList.add('drag-over');
      const dragging=document.querySelector('.card.dragging');
      if(!dragging)return;
      const after=getAfter(body,e.clientY);
      if(after)body.insertBefore(dragging,after);else body.appendChild(dragging);
    });
    body.addEventListener('dragleave',e=>{
      if(!body.contains(e.relatedTarget))body.closest('.lane').classList.remove('drag-over');
    });
    body.addEventListener('drop',e=>{
      e.preventDefault();
      body.closest('.lane').classList.remove('drag-over');
    });
  });
}

function getAfter(c,y){
  const els=[...c.querySelectorAll('.card:not(.dragging),.sc')];
  return els.reduce((cl,ch)=>{
    const b=ch.getBoundingClientRect();const off=y-b.top-b.height/2;
    return off<0&&off>cl.offset?{offset:off,element:ch}:cl;
  },{offset:-Infinity}).element;
}

// ═══════════════════ LANE DRAG (reorder lanes) ═══════════════════

function initLaneDrag(){
  let dragLaneId=null;
  document.querySelectorAll('.lane-hdr[draggable]').forEach(hdr=>{
    hdr.addEventListener('dragstart',e=>{
      dragLaneId=hdr.dataset.laneDrag;
      e.dataTransfer.setData('text/plain','lane:'+dragLaneId);
      e.dataTransfer.effectAllowed='move';
      setTimeout(()=>hdr.closest('.lane').style.opacity='.4',0);
    });
    hdr.addEventListener('dragend',()=>{
      hdr.closest('.lane').style.opacity='';
      dragLaneId=null;
      document.querySelectorAll('.lane').forEach(l=>l.classList.remove('drag-over-lane'));
    });
  });

  document.querySelectorAll('.lane').forEach(lane=>{
    lane.addEventListener('dragover',e=>{
      const data=e.dataTransfer.types;
      if(!data.includes('text/plain'))return;
      e.preventDefault();
      if(dragLaneId&&lane.dataset.lane!==dragLaneId){
        lane.classList.add('drag-over-lane');
      }
    });
    lane.addEventListener('dragleave',e=>{
      if(!lane.contains(e.relatedTarget))lane.classList.remove('drag-over-lane');
    });
    lane.addEventListener('drop',e=>{
      lane.classList.remove('drag-over-lane');
      if(!dragLaneId)return;
      const targetId=lane.dataset.lane;
      if(targetId===dragLaneId)return;
      e.preventDefault();
      e.stopPropagation();
      // Swap lanes
      const board=document.getElementById('board');
      const allLanes=[...board.querySelectorAll('.lane')];
      const srcLane=allLanes.find(l=>l.dataset.lane===dragLaneId);
      const tgtLane=lane;
      if(!srcLane)return;
      const srcGap=srcLane.previousElementSibling;
      const tgtGap=tgtLane.previousElementSibling;
      // Insert src before target
      if(tgtGap&&tgtGap.classList.contains('lane-gap')){
        board.insertBefore(srcLane,tgtGap);
        if(srcGap&&srcGap.classList.contains('lane-gap'))board.insertBefore(srcGap,srcLane);
      }else{
        board.insertBefore(srcLane,tgtLane);
      }
      saveLaneOrder();
    });
  });
}

function saveLaneOrder(){
  try{
    const order=[...document.querySelectorAll('.lane')].map(l=>l.dataset.lane);
    localStorage.setItem('dash-lane-order',JSON.stringify(order));
  }catch(e){}
}
function loadLaneOrder(){
  try{const s=localStorage.getItem('dash-lane-order');return s?JSON.parse(s):null;}catch(e){return null;}
}

// ═══════════════════ LANE RESIZE ═══════════════════

function initLaneResize(){
  document.querySelectorAll('.lane-resize').forEach(handle=>{
    let startX,startW,lane;
    handle.addEventListener('mousedown',e=>{
      e.preventDefault();
      lane=handle.closest('.lane');
      startX=e.clientX;
      startW=lane.getBoundingClientRect().width;
      handle.classList.add('active');
      const onMove=ev=>{
        const diff=ev.clientX-startX;
        const newW=Math.max(200,Math.min(800,startW+diff));
        lane.style.flexBasis=newW+'px';
      };
      const onUp=()=>{
        handle.classList.remove('active');
        document.removeEventListener('mousemove',onMove);
        document.removeEventListener('mouseup',onUp);
        saveLaneWidth(lane.dataset.lane,parseInt(lane.style.flexBasis));
      };
      document.addEventListener('mousemove',onMove);
      document.addEventListener('mouseup',onUp);
    });
  });
}

function saveLaneWidth(id,w){
  try{const d=JSON.parse(localStorage.getItem('dash-lane-widths')||'{}');d[id]=w;localStorage.setItem('dash-lane-widths',JSON.stringify(d));}catch(e){}
}
function loadLaneWidth(id){
  try{const d=JSON.parse(localStorage.getItem('dash-lane-widths')||'{}');return d[id]||null;}catch(e){return null;}
}

// ═══════════════════ CARD RESIZE ═══════════════════

function startCardResize(e){
  e.preventDefault();
  e.stopPropagation();
  const card=e.target.closest('.card,.sc');
  if(!card)return;
  const startY=e.clientY;
  const startH=card.getBoundingClientRect().height;
  card.style.overflow='hidden';
  const onMove=ev=>{
    const diff=ev.clientY-startY;
    card.style.height=Math.max(40,startH+diff)+'px';
  };
  const onUp=()=>{
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
  };
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

// ═══════════════════ LAYOUT TOGGLE ═══════════════════

function toggleLayout(){
  const board=document.getElementById('board');
  board.classList.toggle('grid-layout');
  try{localStorage.setItem('dash-grid',board.classList.contains('grid-layout')?'1':'');}catch(e){}
}
function loadLayout(){
  try{if(localStorage.getItem('dash-grid')==='1')document.getElementById('board').classList.add('grid-layout');}catch(e){}
}

// ═══════════════════ THEME ═══════════════════

function toggleTheme(){
  const r=document.documentElement,c=r.getAttribute('data-theme');
  const n=c==='dark'?'light':'dark';r.setAttribute('data-theme',n);
  try{localStorage.setItem('dash-theme',n);}catch(e){}
}
(function(){try{const s=localStorage.getItem('dash-theme');if(s)document.documentElement.setAttribute('data-theme',s);}catch(e){}})();

// ═══════════════════ INIT ═══════════════════
renderBoard();
loadLayout();
</script>
</body>
</html>
